services:
  app:
    image: ghcr.io/twuijri/link-page-manager:latest
    container_name: link-page-manager
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - link-page-manager-data:/app/data
      - link-page-manager-uploads:/app/public/uploads
    environment:
      - NODE_ENV=production

volumes:
  link-page-manager-data:
  link-page-manager-uploads:
